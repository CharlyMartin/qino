version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    versioning-strategy: increase
    ignore:
      - dependency-name: "@types/node"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
      tanstack:
        patterns:
          - "@tanstack/*"
