name: Dependabot auto-merge

# pull_request_target gives the token write access. Never check out or run the
# PR's code here: its manifests are only read as data through the API.
on: pull_request_target

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write # merge the PR
      pull-requests: write # enable auto-merge
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3

      - id: scope
        name: Check the PR only bumps devDependencies
        if: >-
          steps.metadata.outputs.dependency-type == 'direct:development' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path')
          if [ -z "$files" ]; then
            echo "No changed files found, leaving the PR for a human"
            exit 0
          fi
          while read -r file; do
            case "$file" in
              pnpm-lock.yaml) ;;
              package.json | */package.json)
                for ref in "$BASE" "$HEAD"; do
                  gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=$ref" -H "Accept: application/vnd.github.raw" \
                    | jq -S '{dependencies, peerDependencies, optionalDependencies}' > "$RUNNER_TEMP/$ref.json"
                done
                if ! cmp -s "$RUNNER_TEMP/$BASE.json" "$RUNNER_TEMP/$HEAD.json"; then
                  echo "$file changes more than devDependencies, leaving the PR for a human"
                  exit 0
                fi
                ;;
              *)
                echo "$file is not a manifest or the lockfile, leaving the PR for a human"
                exit 0
                ;;
            esac
          done <<< "$files"
          echo "dev-only=true" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.scope.outputs.dev-only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash
